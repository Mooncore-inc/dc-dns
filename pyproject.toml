[project]
name = "demon-cry-dns"
version = "0.1.0"
description = "DNS lookup module for demon-cry"
authors = [
    {name = "mooncore-inc"}
]
license = "Apache2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "demon-cry-base (>=0.1.0,<0.2.0)",
    "aiodns>=4.0.4,<5.0.0"
]

[project.entry-points."demon_cry.modules"]
dns_lookup = "demon_cry_dns:DnsLookup"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
